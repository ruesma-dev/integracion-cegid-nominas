# config/join_config.yaml

tables:
  partes: DimPartesTrabajoDetalle
  recursos: DimRecursos
  tipo_hora: DimTipoHora
  empleados: DimEmpleados

extract:
  # “Mes indicado” (year/month) se computa como:
  # desde el 16 del mes anterior (inclusive) hasta el 15 del mes indicado (inclusive)
  partes_filter:
    column: fec
    year: 2025
    month: 12

# Plantillas de entrada (múltiples)
templates:
  input_dir: input
  pattern: "*.xlsx"           # por ejemplo: "base_*.xlsx" si quieres filtrar
  output_subdir: plantillas   # se guardará en output/plantillas
  sheet: ""                   # vacío = hoja activa; o nombre exacto de hoja

calendar:
  holidays_by_year:
    "2025":
      - "2025-01-01"
      - "2025-01-06"
      - "2025-02-28"
      - "2025-04-17"
      - "2025-04-18"
      - "2025-05-01"
      - "2025-05-02"
      - "2025-05-07"
      - "2025-06-19"
      - "2025-06-20"
      - "2025-08-15"
      - "2025-10-13"
      - "2025-11-01"
      - "2025-12-06"
      - "2025-12-08"
      - "2025-12-25"
      - "2025-12-26"
      - "2025-12-31"
    "2026":
      - "2026-01-01"
      - "2026-01-02"
      - "2026-01-05"
      - "2026-01-06"
      - "2026-04-02"
      - "2026-04-03"
      - "2026-04-06"
      - "2026-05-01"
      - "2026-05-02"
      - "2026-05-14"
      - "2026-05-15"
      - "2026-08-14"
      - "2026-08-15"
      - "2026-10-12"
