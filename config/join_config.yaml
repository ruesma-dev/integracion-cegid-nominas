joins:
  join_1:
    right_table: tipo_hora
    left_key: horide
    right_key: ide
    bring_columns:
      - name: cod
        alias: cod_tipo_hora
      - name: res
        alias: res_tipo_hora

  join_2:
    right_table: recursos
    left_key: reside
    right_key: ide
    bring_columns:
      - name: conide
        alias: conide

  join_3:
    right_table: empleados
    left_key: conide
    right_key: ide
    bring_columns:
      - name: res
        alias: res_empleado
      - name: tarseg
        alias: tarseg
      - name: dni
        alias: dni
