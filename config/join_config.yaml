# config/join_config.yaml

tables:
  partes: DimPartesTrabajoDetalle
  recursos: DimRecursos
  tipo_hora: DimTipoHora
  empleados: DimEmpleados

extract:
  # “Mes indicado” (year/month) se computa como:
  # desde el 16 del mes anterior (inclusive) hasta el 15 del mes indicado (inclusive)
  partes_filter:
    column: fec
    year: 2025
    month: 12

calendar:
  holidays_by_year:
    "2025":
      # Calendario Construcción Sevilla 2025 (incluye festivos y días inhábiles de convenio).
      # Nota: el 16/04 (Miércoles Santo) es jornada reducida, no festivo, por eso NO se incluye.
      # Fuente: Calendario Sevilla 2025. :contentReference[oaicite:0]{index=0}
      - "2025-01-01"  # Año Nuevo
      - "2025-01-06"  # Epifanía del Señor
      - "2025-02-28"  # Día de Andalucía
      - "2025-04-17"  # Jueves Santo
      - "2025-04-18"  # Viernes Santo
      - "2025-05-01"  # Día del Trabajador
      - "2025-05-02"  # Día inhábil de convenio
      - "2025-05-07"  # Miércoles de Feria (fiesta local)
      - "2025-06-19"  # Corpus Christi
      - "2025-06-20"  # Día inhábil de convenio
      - "2025-08-15"  # Asunción de la Virgen María
      - "2025-10-13"  # Fiesta Nacional (traslado de 12/10 domingo)
      - "2025-11-01"  # Todos los Santos
      - "2025-12-06"  # Constitución Española
      - "2025-12-08"  # Inmaculada Concepción
      - "2025-12-25"  # Natividad del Señor
      - "2025-12-26"  # Día inhábil de convenio
      - "2025-12-31"  # Día inhábil de convenio

    "2026":
      # Calendario laboral 2026 Construcción Madrid (CCOO Hábitat). :contentReference[oaicite:1]{index=1}
      - "2026-01-01"
      - "2026-01-02"
      - "2026-01-05"
      - "2026-01-06"
      - "2026-04-02"
      - "2026-04-03"
      - "2026-04-06"
      - "2026-05-01"
      - "2026-05-02"
      - "2026-05-14"
      - "2026-05-15"
      - "2026-08-14"
      - "2026-08-15"
      - "2026-10-12"
      - "2026-11-02"
      - "2026-11-09"
      - "2026-12-07"
      - "2026-12-08"
      - "2026-12-24"
      - "2026-12-25"
      - "2026-12-31"

joins:
  join_1:
    right_table: tipo_hora
    left_key: horide
    right_key: ide
    bring_columns:
      - name: cod
        alias: cod_tipo_hora
      - name: res
        alias: res_tipo_hora

  join_2:
    right_table: recursos
    left_key: reside
    right_key: ide
    bring_columns:
      - name: conide
        alias: conide

  join_3:
    right_table: empleados
    left_key: conide
    right_key: ide
    bring_columns:
      - name: res
        alias: res_empleado
      - name: tarseg
        alias: tarseg
      - name: dni
        alias: dni
